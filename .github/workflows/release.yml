name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Validate tag and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          test -s "docs/release-notes/$RELEASE_TAG.md"
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES.md
          printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      release_version: ${{ needs.version.outputs.version }}
    permissions:
      contents: read

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  release:
    needs: [verify, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: unsit-macos-*
          merge-multiple: true
          path: dist
      - name: Verify and collect checksums
        run: |
          cd dist
          sha256sum --check checksums-macos-arm64.txt
          sha256sum --check checksums-macos-x86_64.txt
          sha256sum *.zip *.dmg *.update.json *.tar.gz > checksums.txt
      - name: Create draft with tested artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.dmg dist/*.update.json dist/*.tar.gz dist/checksums.txt --draft --verify-tag --title "Unsit $RELEASE_TAG" --notes-file "docs/release-notes/$RELEASE_TAG.md" "${prerelease[@]}"
      - name: Attest app, CLI, sources, and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.zip
            dist/*.dmg
            dist/*.update.json
            dist/*.tar.gz
            dist/checksums.txt
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
